[project]
name = "generatore-videogiochi"
version = "0.1.0"
description = "Software per generare videogiochi a partire da una descrizione in JSON"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
genera-gioco = "generatore.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["generatore*"]

[tool.setuptools.package-data]
generatore = ["modelli/*.html"]
